apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: internconnect
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080                  # Access via http://localhost:30080 on minikube/Docker Desktop K8s
  type: NodePort                       # Exposes service on each Node's IP at a static port
