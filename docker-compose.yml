services:

  # ── Backend API ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: internconnect-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "7000:7000"
    networks:
      - internconnect-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend Web ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend/InternConnect
      dockerfile: Dockerfile
    container_name: internconnect-frontend
    restart: unless-stopped
    ports:
      - "4910:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internconnect-net

  # ── Prometheus Monitoring ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: internconnect-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-storage:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - internconnect-net

  # ── Grafana Dashboard ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: internconnect-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-storage:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - internconnect-net

  # ── Node Exporter (Server Metrics) ─────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: internconnect-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - internconnect-net

volumes:
  prometheus-storage:
  grafana-storage:

networks:
  internconnect-net:
    driver: bridge
