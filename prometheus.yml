global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'internconnect-monitor'

scrape_configs:
  # ── Prometheus Self-Monitoring ───────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Backend API Metrics ───────────────────────────────────────────────
  - job_name: 'backend'
    static_configs:
      - targets: ['internconnect-backend:7000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # ── Node Exporter (Server Health) ─────────────────────────────────────
  - job_name: 'node'
    static_configs:
      - targets: ['internconnect-node-exporter:9100']
    scrape_interval: 10s

  # ── Docker Stats (if running on Linux) ────────────────────────────────
  # Uncomment below if using cAdvisor for container metrics
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['internconnect-cadvisor:8080']
